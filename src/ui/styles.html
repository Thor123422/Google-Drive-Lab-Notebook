<style>
/* ==================================================================
   Design tokens
   Chart series colours and chrome come from a validated palette:
   adjacent-pair CVD separation and contrast were checked against both
   surfaces. Aqua and yellow fall below 3:1 on the light surface, so
   every chart that uses them ships visible labels and a table view.
   ================================================================== */
:root {
  color-scheme: light;

  --surface-1: #fcfcfb;   /* cards, chart surface */
  --surface-2: #f9f9f7;   /* page plane */
  --surface-3: #f2f1ed;   /* inset wells, table stripes */
  --surface-raised: #ffffff;

  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --text-inverse: #fcfcfb;

  --border: rgba(11, 11, 11, 0.10);
  --border-strong: #c3c2b7;
  --grid: #e1e0d9;

  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;

  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --success-text: #006300;

  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --accent-text: #1c5cab;

  --shadow-sm: 0 1px 2px rgba(11, 11, 11, 0.06);
  --shadow-md: 0 4px 16px rgba(11, 11, 11, 0.10);
  --shadow-lg: 0 16px 48px rgba(11, 11, 11, 0.18);

  --radius-sm: 4px;
  --radius: 8px;
  --radius-lg: 12px;

  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --sidebar-w: 212px;
  --topbar-h: 56px;
}

:root[data-theme="dark"],
:root:not([data-theme="light"]) {
  /* dark values applied below via the two scopes */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #0d0d0d;
    --surface-3: #232322;
    --surface-raised: #242423;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --text-inverse: #0b0b0b;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: #383835;
    --grid: #2c2c2a;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --success-text: #0ca30c;
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.16);
    --accent-text: #86b6ef;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.55);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --surface-2: #0d0d0d;
  --surface-3: #232322;
  --surface-raised: #242423;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --text-inverse: #0b0b0b;
  --border: rgba(255, 255, 255, 0.10);
  --border-strong: #383835;
  --grid: #2c2c2a;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --success-text: #0ca30c;
  --accent: #3987e5;
  --accent-soft: rgba(57, 135, 229, 0.16);
  --accent-text: #86b6ef;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.55);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.7);
}

/* ============================ reset ============================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--surface-2);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1 { font-size: 22px; letter-spacing: -0.01em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
h4 { font-size: 13px; }
p { margin: 0 0 10px; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ============================ layout ============================= */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "brand topbar" "sidebar main";
  height: 100vh;
}

.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 16px;
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
}

.brand-mark {
  width: 22px; height: 22px;
  flex: none;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
}

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
}

.sidebar {
  grid-area: sidebar;
  background: var(--surface-1);
  border-right: 1px solid var(--border);
  padding: 10px 8px;
  overflow-y: auto;
}

.main {
  grid-area: main;
  overflow-y: auto;
  padding: 22px 26px 64px;
}

.main-inner { max-width: 1240px; margin: 0 auto; }

@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: var(--topbar-h) auto 1fr;
    grid-template-areas: "topbar" "sidebar" "main";
  }
  .brand { display: none; }
  .sidebar {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
  }
  .nav-link { white-space: nowrap; }
  .nav-section-label { display: none; }
  .main { padding: 16px; }
}

/* ========================== navigation =========================== */

.nav-section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  padding: 12px 10px 5px;
  font-weight: 600;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  border: 0;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.nav-link:hover { background: var(--surface-3); color: var(--text-primary); }
.nav-link.is-active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-link .nav-icon { width: 16px; flex: none; text-align: center; opacity: 0.85; }
.nav-link .nav-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* ========================== primitives =========================== */

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 16px 18px; }

.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
}
.card-head h2, .card-head h3 { margin: 0; }
.card-head .spacer { flex: 1; }

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); }

.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }

.page-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.page-head .sub { color: var(--text-secondary); font-size: 13px; margin-top: 3px; }

.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.bold { font-weight: 600; }

/* =========================== buttons ============================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 13px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-raised);
  color: var(--text-primary);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-text); border-color: var(--accent-text); }
.btn-danger { color: var(--status-critical); border-color: var(--status-critical); background: transparent; }
.btn-danger:hover { background: rgba(208, 59, 59, 0.10); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--surface-3); color: var(--text-primary); }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-icon { padding: 6px; width: 30px; height: 30px; }

.btn-group { display: inline-flex; gap: 0; }
.btn-group .btn { border-radius: 0; margin-left: -1px; }
.btn-group .btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); margin-left: 0; }
.btn-group .btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.btn-group .btn.is-active { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); z-index: 1; }

/* ============================ forms ============================== */

.field { display: flex; flex-direction: column; gap: 4px; }
.field > label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}
.field .hint { font-size: 11px; color: var(--text-muted); }

input[type="text"], input[type="number"], input[type="date"], input[type="email"],
input[type="search"], input[type="url"], select, textarea {
  font: inherit;
  font-size: 13px;
  padding: 7px 9px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text-primary);
  width: 100%;
  min-width: 0;
}
textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
textarea.code { font-family: var(--mono); font-size: 12.5px; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="checkbox"] { width: auto; accent-color: var(--accent); }

.checkline { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.checkline input { margin: 0; }

.search-box { position: relative; flex: 1; max-width: 460px; }
.search-box input { padding-left: 30px; }
.search-box::before {
  content: "⌕";
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
}

.filters {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.filters select, .filters input { width: auto; min-width: 128px; }

/* ============================ tables ============================= */

.table-wrap { overflow-x: auto; }

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 600;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
  background: var(--surface-1);
  position: sticky;
  top: 0;
  z-index: 1;
}
table.data td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
table.data tbody tr:hover { background: var(--surface-3); }
table.data tr.clickable { cursor: pointer; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tfoot td {
  font-weight: 600;
  border-top: 1px solid var(--border-strong);
  border-bottom: 0;
  background: var(--surface-1);
}

/* ============================ badges ============================= */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.6;
  border: 1px solid var(--border);
  background: var(--surface-3);
  color: var(--text-secondary);
  white-space: nowrap;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

.badge.is-good { color: var(--success-text); border-color: rgba(12, 163, 12, 0.35); background: rgba(12, 163, 12, 0.10); }
.badge.is-warning { color: #8a5a00; border-color: rgba(250, 178, 25, 0.45); background: rgba(250, 178, 25, 0.14); }
.badge.is-serious { color: #a24218; border-color: rgba(236, 131, 90, 0.45); background: rgba(236, 131, 90, 0.14); }
.badge.is-critical { color: var(--status-critical); border-color: rgba(208, 59, 59, 0.40); background: rgba(208, 59, 59, 0.10); }
.badge.is-accent { color: var(--accent-text); border-color: rgba(42, 120, 214, 0.35); background: var(--accent-soft); }

:root[data-theme="dark"] .badge.is-warning,
:root:not([data-theme="light"]) .badge.is-warning { color: var(--status-warning); }
:root[data-theme="dark"] .badge.is-serious,
:root:not([data-theme="light"]) .badge.is-serious { color: var(--status-serious); }

.tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11px;
}

/* ========================== stat tiles =========================== */

.stat {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.055em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 5px;
}
.stat-value {
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text-primary);
}
.stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ========================= progress bar ========================== */

.meter {
  height: 6px;
  border-radius: 3px;
  background: var(--surface-3);
  overflow: hidden;
  display: flex;
}
.meter-fill { height: 100%; }
.meter-fill + .meter-fill { border-left: 2px solid var(--surface-1); }

/* ============================ modal ============================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11, 11, 11, 0.45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
}
.modal {
  background: var(--surface-1);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 620px;
  border: 1px solid var(--border);
}
.modal.wide { max-width: 940px; }
.modal-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-body { padding: 18px 20px; }
.modal-foot {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  flex-wrap: wrap;
}
.modal-foot .spacer { flex: 1; }

/* ============================ toasts ============================= */

.toasts {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
  max-width: min(420px, calc(100vw - 36px));
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 11px 14px;
  border-radius: var(--radius);
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-md);
  font-size: 13px;
  animation: toast-in 0.18s ease-out;
}
.toast.is-error { border-left: 3px solid var(--status-critical); }
.toast.is-success { border-left: 3px solid var(--status-good); }
.toast.is-info { border-left: 3px solid var(--accent); }
.toast .toast-close { margin-left: auto; cursor: pointer; color: var(--text-muted); border: 0; background: none; font-size: 16px; line-height: 1; padding: 0 2px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* =========================== empty state ========================= */

.empty {
  text-align: center;
  padding: 44px 20px;
  color: var(--text-secondary);
}
.empty .empty-icon { font-size: 30px; opacity: 0.4; margin-bottom: 10px; }
.empty h3 { margin-bottom: 5px; color: var(--text-primary); }
.empty p { max-width: 420px; margin: 0 auto 14px; font-size: 13px; }

/* ============================ loading ============================ */

.spinner {
  width: 15px; height: 15px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-pane { display: flex; align-items: center; gap: 10px; padding: 36px; color: var(--text-secondary); justify-content: center; }

.progress-track { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); transition: width 0.2s; border-radius: 3px; }

/* ============================= tabs ============================== */

.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  overflow-x: auto;
}
.tab {
  padding: 8px 13px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  border: 0;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: inherit;
  white-space: nowrap;
}
.tab:hover { color: var(--text-primary); }
.tab.is-active { color: var(--accent-text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .tab-count { color: var(--text-muted); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* =========================== notebook ============================ */

.entry-card { border-left: 3px solid var(--border-strong); }
.entry-card.is-signed { border-left-color: var(--status-good); }

.prose { font-size: 13.5px; line-height: 1.62; color: var(--text-primary); }
.prose h1, .prose h2 { font-size: 15px; margin: 18px 0 7px; }
.prose h3, .prose h4 { font-size: 13.5px; margin: 15px 0 5px; color: var(--text-secondary); }
.prose p { margin: 0 0 9px; }
.prose ul, .prose ol { margin: 0 0 9px; padding-left: 20px; }
.prose li { margin-bottom: 3px; }
.prose code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--surface-3);
  padding: 1px 4px;
  border-radius: 3px;
}
.prose pre {
  background: var(--surface-3);
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  border: 1px solid var(--border);
}
.prose pre code { background: none; padding: 0; }
.prose blockquote {
  margin: 0 0 9px;
  padding-left: 12px;
  border-left: 3px solid var(--border-strong);
  color: var(--text-secondary);
}
.prose table { border-collapse: collapse; font-size: 12.5px; margin-bottom: 10px; }
.prose th, .prose td { border: 1px solid var(--border); padding: 5px 9px; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

/* ============================ links ============================== */

.link-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 100px;
  background: var(--surface-3);
