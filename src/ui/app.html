<script>
/* ==================================================================
   app.html — state, transport, routing and the application shell.
   Loaded last, so every view function is already defined.
   ================================================================== */

var App = {
  ready: false,
  status: {},
  settings: {},
  enums: {},
  projects: [],
  dashboard: null,
  route: { view: 'dashboard', id: '', tab: '', query: {} },
  cache: {},

  /* ------------------------------ RPC ---------------------------- */

  /**
   * One call shape for the whole app. Resolves with the payload or
   * rejects with an Error carrying `.code` from the server.
   */
  rpc: function (action, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (envelope) {
          if (!envelope) {
            reject(Object.assign(new Error('The server returned nothing.'), { code: 'empty' }));
            return;
          }
          if (envelope.ok) { resolve(envelope.data); return; }
          var error = new Error(envelope.error.message || 'Request failed.');
          error.code = envelope.error.code;
          error.details = envelope.error.details;
          reject(error);
        })
        .withFailureHandler(function (err) {
          var error = new Error(
            (err && err.message) ? err.message : 'Lost contact with the server.'
          );
          error.code = 'transport';
          reject(error);
        })
        .rpc(action, payload || {});
    });
  },

  /** rpc() that reports its own failure as a toast. */
  call: function (action, payload) {
    return this.rpc(action, payload).catch(function (err) {
      Toast.err(err.message);
      throw err;
    });
  },

  /* ----------------------------- boot ---------------------------- */

  boot: function () {
    var initial = window.__BOOT__ || {};
    this.enums = initial.enums || {};
    this.status = initial.status || {};

    this.applyTheme();

    if (initial.error) {
      document.getElementById('root').innerHTML = this.fatalScreen(initial.error.message);
      return;
    }

    if (!initial.ready) {
      this.renderSetup();
      return;
    }

    this.ready = true;
    this.settings = initial.settings || {};
    this.projects = initial.projects || [];
    this.dashboard = initial.dashboard || null;

    this.renderShell();
    window.addEventListener('hashchange', function () { App.handleRoute(); });
    this.handleRoute();
  },

  applyTheme: function () {
    var theme = (this.settings && this.settings.theme) ||
      localStorage.getItem('ln.theme') || 'system';
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  },

  setTheme: function (theme) {
    this.settings.theme = theme;
    localStorage.setItem('ln.theme', theme);
    this.applyTheme();
    this.rpc('app.saveSettings', { settings: { theme: theme } }).catch(function () {});
  },

  fatalScreen: function (message) {
    return '<div style="max-width:520px;margin:80px auto;padding:0 20px">' +
      '<div class="card card-pad">' +
      '<h1 style="margin-bottom:8px">Something went wrong</h1>' +
      '<p class="secondary">' + esc(message) + '</p>' +
      '<button class="btn btn-primary" onclick="location.reload()">Reload</button>' +
      '</div></div>';
  },

  /* ---------------------------- setup ---------------------------- */

  renderSetup: function () {
    document.getElementById('root').innerHTML =
      '<div style="max-width:560px;margin:70px auto;padding:0 20px">' +
        '<div class="card card-pad">' +
          '<h1 style="margin-bottom:6px">Set up your lab notebook</h1>' +
          '<p class="secondary">This creates a <strong>Lab Notebook</strong> folder in your ' +
            'Google Drive holding a spreadsheet for your records and a folder per project ' +
            'for uploaded files. Nothing leaves your Drive.</p>' +
          '<div class="divider"></div>' +
          '<div id="setup-status" class="secondary small" style="margin-bottom:14px"></div>' +
          '<div class="row">' +
            '<button class="btn btn-primary" id="setup-go">Create my workspace</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('setup-go').addEventListener('click', function () {
      var button = this;
      var status = document.getElementById('setup-status');
      button.disabled = true;
      button.textContent = 'Creating…';
      status.innerHTML = '<span class="spinner"></span> Provisioning Drive folders and the spreadsheet…';

      App.rpc('app.setup', {}).then(function () {
        status.textContent = 'Done. Reloading…';
        setTimeout(function () { location.reload(); }, 600);
      }).catch(function (err) {
        button.disabled = false;
        button.textContent = 'Try again';
        status.innerHTML = '<span style="color:var(--status-critical)">' + esc(err.message) + '</span>';
      });
    });
  },

  /* ---------------------------- shell ---------------------------- */

  nav: [
    { section: 'Overview' },
    { id: 'dashboard', label: 'Dashboard', icon: '◉', hash: '#/' },
    { id: 'projects', label: 'Projects', icon: '▣', hash: '#/projects' },
    { section: 'Record' },
    { id: 'notebook', label: 'Notebook', icon: '✎', hash: '#/notebook' },
    { id: 'files', label: 'Files', icon: '⎙', hash: '#/files' },
    { section: 'Resources' },
    { id: 'inventory', label: 'Inventory', icon: '⬚', hash: '#/inventory' },
    { id: 'purchases', label: 'Purchases', icon: '⇄', hash: '#/purchases' },
    { id: 'budget', label: 'Budget', icon: '◧', hash: '#/budget' },
    { section: '' },
    { id: 'settings', label: 'Settings', icon: '⚙', hash: '#/settings' }
  ],

  renderShell: function () {
    document.getElementById('root').innerHTML =
      '<div class="app">' +
        '<div class="brand">' +
          '<span class="brand-mark" aria-hidden="true">LN</span>' +
          '<span>Lab Notebook</span>' +
        '</div>' +
        '<header class="topbar">' +
          '<div class="search-box">' +
            '<input type="search" id="global-search" placeholder="Search projects, entries, files, parts…" ' +
              'autocomplete="off" aria-label="Search everything">' +
            '<div id="search-results"></div>' +
          '</div>' +
          '<div class="spacer"></div>' +
          '<button class="btn btn-sm" id="quick-entry" title="New notebook entry">✎ New entry</button>' +
          '<button class="btn btn-ghost btn-icon" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◐</button>' +
        '</header>' +
        '<nav class="sidebar" id="sidebar"></nav>' +
        '<main class="main"><div class="main-inner" id="view"></div></main>' +
      '</div>';

    this.renderNav();
    this.wireTopbar();
  },

  renderNav: function () {
    var current = this.route.view;
    document.getElementById('sidebar').innerHTML = this.nav.map(function (item) {
      if (item.section !== undefined) {
        return item.section
          ? '<div class="nav-section-label">' + esc(item.section) + '</div>'
          : '<div style="height:10px"></div>';
      }
      return '<a class="nav-link' + (item.id === current ? ' is-active' : '') + '" href="' +
        attr(item.hash) + '"><span class="nav-icon" aria-hidden="true">' + item.icon +
        '</span><span>' + esc(item.label) + '</span></a>';
    }).join('');
  },

  wireTopbar: function () {
    var input = document.getElementById('global-search');
    var panel = document.getElementById('search-results');

    var run = debounce(function () {
      var query = input.value.trim();
      if (query.length < 2) { panel.innerHTML = ''; return; }
      App.rpc('app.search', { query: query }).then(function (result) {
        if (input.value.trim() !== query) return;
        if (!result.total) {
          panel.innerHTML = '<div class="search-results"><div class="result-row">' +
            '<span class="r-title muted">No matches for “' + esc(query) + '”</span></div></div>';
          return;
        }
        panel.innerHTML = '<div class="search-results">' + result.groups.map(function (group) {
          return '<div class="result-group">' +
            '<div class="result-group-label">' + esc(group.label) + '</div>' +
            group.rows.map(function (row) {
              return '<div class="result-row" data-kind="' + attr(group.kind) + '" ' +
                'data-id="' + attr(row.id) + '" data-project="' + attr(row.projectId || '') + '">' +
                '<span class="r-title">' + esc(row.title) + '</span>' +
                '<span class="r-sub">' + esc(row.subtitle) + '</span></div>';
            }).join('') + '</div>';
        }).join('') + '</div>';
      }).catch(function () { panel.innerHTML = ''; });
    }, 240);

    input.addEventListener('input', run);
    input.addEventListener('focus', run);

    panel.addEventListener('click', function (event) {
      var row = event.target.closest('.result-row[data-kind]');
      if (!row) return;
      App.openSearchResult(row.dataset.kind, row.dataset.id, row.dataset.project);
      panel.innerHTML = '';
      input.value = '';
    });

    document.addEventListener('click', function (event) {
      if (!event.target.closest('.search-box')) panel.innerHTML = '';
    });

    document.getElementById('theme-toggle').addEventListener('click', function () {
      var order = ['system', 'light', 'dark'];
      var next = order[(order.indexOf(App.settings.theme || 'system') + 1) % order.length];
      App.setTheme(next);
      Toast.info('Theme: ' + next);
    });

    document.getElementById('quick-entry').addEventListener('click', function () {
      Notebook.openEditor(null, App.route.view === 'project' ? App.route.id : '');
    });

    document.addEventListener('keydown', function (event) {
      if ((event.metaKey || event.ctrlKey) && event.key === 'k') {
        event.preventDefault();
        input.focus();
        input.select();
      }
    });
  },

  openSearchResult: function (kind, id, projectId) {
    if (kind === 'project') this.navigate('#/project/' + id);
    else if (kind === 'entry') this.navigate('#/project/' + projectId + '/notebook?entry=' + id);
    else if (kind === 'file') this.navigate('#/project/' + projectId + '/files?file=' + id);
    else if (kind === 'item') this.navigate('#/item/' + id);
    else if (kind === 'bom') this.navigate('#/project/' + projectId + '/boms?bom=' + id);
    else if (kind === 'purchase') this.navigate('#/purchases?purchase=' + id);
  },

  /* ---------------------------- routing -------------------------- */

  navigate: function (hash) {
    if (location.hash === hash) this.handleRoute();
    else location.hash = hash;
  },

  parseRoute: function () {
    var raw = (location.hash || '#/').replace(/^#/, '');
    var split = raw.split('?');
    var segments = split[0].split('/').filter(Boolean);
    var query = {};
    (split[1] || '').split('&').filter(Boolean).forEach(function (pair) {
      var kv = pair.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });

    if (!segments.length) return { view: 'dashboard', id: '', tab: '', query: query };
    if (segments[0] === 'project') {
      return {
        view: 'project', id: segments[1] || '',
        tab: segments[2] || 'overview', query: query
      };
    }
    if (segments[0] === 'item') {
      return { view: 'item', id: segments[1] || '', tab: '', query: query };
    }
    return { view: segments[0], id: segments[1] || '', tab: segments[2] || '', query: query };
  },

  handleRoute: function () {
    this.route = this.parseRoute();
    this.renderNav();

    var host = document.getElementById('view');
    host.innerHTML = loadingPane();
    window.scrollTo(0, 0);

    var views = {
      dashboard: Dashboard.render,
      projects: Projects.renderList,
      project: Projects.renderDetail,
      notebook: Notebook.renderAll,
      files: FilesView.renderAll,
      inventory: Inventory.renderList,
      item: Inventory.renderDetail,
      purchases: Purchases.renderList,
      budget: BudgetView.renderPortfolio,
      settings: Settings.render
    };

    var view = views[this.route.view];
    if (!view) {
      host.innerHTML = emptyState('🧭', 'Page not found',
        'That address does not match anything in the app.',
        '<a class="btn btn-primary" href="#/">Back to the dashboard</a>');
      return;
    }

    try {
      view(host, this.route);
    } catch (err) {
      host.innerHTML = this.fatalScreen(err.message);
      console.error(err);
    }
  },

  /** Keep the cached project list in step after a create/rename. */
  refreshProjects: function () {
    return this.rpc('projects.options').then(function (projects) {
      App.projects = projects;
      return projects;
    });
  },

  /* ---------------------- shared view helpers -------------------- */

  /** Standard page header with a title, subtitle and action buttons. */
  pageHead: function (title, subtitle, actionsHtml) {
    return '<div class="page-head">' +
      '<div><h1>' + esc(title) + '</h1>' +
      (subtitle ? '<div class="sub">' + subtitle + '</div>' : '') + '</div>' +
      '<div class="spacer"></div>' +
      (actionsHtml ? '<div class="row row-wrap">' + actionsHtml + '</div>' : '') +
      '</div>';
  },

  statTile: function (label, value, sub) {
    return '<div class="stat">' +
      '<div class="stat-label">' + esc(label) + '</div>' +
      '<div class="stat-value">' + value + '</div>' +
      (sub ? '<div class="stat-sub">' + sub + '</div>' : '') +
      '</div>';
  },

  /** Wire every [data-action] inside a container to a handler map. */
  bind: function (scope, handlers) {
    scope.querySelectorAll('[data-action]').forEach(function (node) {
      if (node.dataset.bound === '1') return;
      node.dataset.bound = '1';
      node.addEventListener('click', function (event) {
        var handler = handlers[node.dataset.action];
        if (!handler) return;
        event.preventDefault();
        event.stopPropagation();
        handler(node.dataset, node, event);
      });
    });
  },

  /** Re-run the current route, e.g. after a mutation. */
  reload: function () {
    this.handleRoute();
  }
};

document.addEventListener('DOMContentLoaded', function () { App.boot(); });
</script>
